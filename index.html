<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toprak Ahmet Aydoğmuş — Doğrulanmış Sertifika Portfolyosu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0B0E14;
      --bg-card: rgba(19, 24, 34, 0.75);
      --bg-card-hover: rgba(28, 35, 51, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00E5FF;
      --accent-green: #00E676;
      --accent-purple: #8A2BE2;
      --accent-pink: #FF007F;
      --text-primary: #FFFFFF;
      --text-secondary: #9EAFC2;
      --text-muted: #5C6B7E;
      --glass-blur: blur(16px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 229, 255, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(138, 43, 226, 0.07) 0%, transparent 40%);
      background-attachment: fixed;
      padding-bottom: 60px;
    }
    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    header {
      text-align: center;
      padding: 40px 20px;
      border-radius: 20px;
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.headline {
      font-size: 1.15rem;
      color: var(--text-secondary);
      max-width: 750px;
      margin: 0 auto 20px auto;
      font-weight: 400;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .stat-num {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-left: 6px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 18px 12px 42px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      backdrop-filter: var(--glass-blur);
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent-cyan);
    }
    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }
    .filter-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 8px 16px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover, .chip.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: var(--glass-blur);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 229, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .card-thumb {
      width: 100%;
      height: 180px;
      border-radius: 10px;
      overflow: hidden;
      background: #06090e;
      margin-bottom: 15px;
      cursor: pointer;
      position: relative;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card-thumb:hover img {
      transform: scale(1.05);
    }
    .card-thumb-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #FFF;
      backdrop-filter: blur(4px);
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #FFF;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .card-issuer {
      font-size: 0.9rem;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card-date {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-verify {
      background: var(--accent-green);
      color: #000;
      flex: 1;
      justify-content: center;
    }
    .btn-verify:hover {
      background: #00C853;
      transform: scale(1.02);
    }
    .btn-view {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }
    .btn-view:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      max-width: 900px;
      max-height: 90vh;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .modal-content img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 8px;
      object-fit: contain;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 1.5rem;
      color: #FFF;
      cursor: pointer;
    }
  </style>

    function init() {
      const issuers = new Set(certificates.map(c => c.issuer || 'Diğer'));
      document.getElementById('stat-total').textContent = certificates.length;
      document.getElementById('stat-verified').textContent = certificates.filter(c => c.verify_url).length;
      document.getElementById('stat-issuers').textContent = issuers.size;

      // Build filter chips
      const chipsContainer = document.getElementById('filterChips');
      const topIssuers = ['BTK Akademi', 'Cisco', 'CyberExam', 'CyberDistro'];
      topIssuers.forEach(iss => {
        if ([...issuers].some(i => i.toLowerCase().includes(iss.toLowerCase()))) {
          const btn = document.createElement('button');
          btn.className = 'chip';
          btn.textContent = iss;
          btn.dataset.filter = iss.toLowerCase();
          btn.onclick = () => filterByChip(btn, iss.toLowerCase());
          chipsContainer.appendChild(btn);
        }
      });

      renderCards(certificates);

      document.getElementById('searchInput').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = certificates.filter(c => 
          (c.title || '').toLowerCase().includes(q) ||
          (c.issuer || '').toLowerCase().includes(q) ||
          (c.date || '').toLowerCase().includes(q)
        );
        renderCards(filtered);
      });
    }

    function filterByChip(btn, filterVal) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      if (filterVal === 'all') {
        renderCards(certificates);
      } else {
        const filtered = certificates.filter(c => (c.issuer || '').toLowerCase().includes(filterVal));
        renderCards(filtered);
      }
    }

    function renderCards(list) {
      const grid = document.getElementById('certGrid');
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">Sertifika bulunamadı.</div>';
        return;
      }

      list.forEach((c, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        const imgName = c.img ? c.img.split(/[/\\]/).pop() : '';
        const imgSrc = imgName ? 'assets/certificates/' + imgName : '';

        card.innerHTML = `
          ${imgSrc ? `
            <div class="card-thumb" onclick="openModal('${c.title.replace(/'/g, "\\'") }', '${imgSrc}')">
              <img src="${imgSrc}" alt="${c.title}" loading="lazy" onerror="this.parentElement.style.display='none'">
              <span class="card-thumb-badge">🔍 Büyüt</span>
            </div>
          ` : ''}
          <div class="card-title">${c.title}</div>
          <div class="card-issuer">🏛️ ${c.issuer || '-'}</div>
          <div class="card-date">📅 ${c.date || '-'} ${c.cred_id ? ' • 🆔 ' + c.cred_id : ''}</div>
          <div class="card-actions">
            ${c.verify_url ? `
              <a href="${c.verify_url}" target="_blank" rel="noopener" class="btn btn-verify">
                🔗 Resmi Doğrula
              </a>
            ` : '<span style="font-size:0.8rem; color:var(--text-muted); align-self:center;">🏛️ Kurum İçi Belge</span>'}
            ${imgSrc ? `
              <button class="btn btn-view" onclick="openModal('${c.title.replace(/'/g, "\\'") }', '${imgSrc}')">
                🖼️ Belge
              </button>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(title, src) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalImg').src = src;
      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
